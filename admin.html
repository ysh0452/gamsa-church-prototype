<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="감사교회 프로토타입">
<meta property="og:description" content="관리자 웹 클릭 프로토타입 (예시 데이터)">
<title>감사교회 관리자 웹 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 시안 C · 투명한 데이터 (D-21). 관리자 웹은 밝은 화면 하나로 설계되어 어두운 테마를 따로 두지 않는다.
   배치: 왼쪽 메뉴 + 위쪽 검색 줄 + 본문. 좁은 화면에서는 메뉴가 아이콘만 남고, 휴대폰 폭에서는 메뉴 버튼으로 연다. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-alt: #eef1f6;
  --primary: #2256f2;
  --primary-press: #1a46cc;
  --primary-soft: #e8effe;
  --accent: #12b5a6;
  --accent-soft: #ddf5f2;
  --text: #111827;
  --text-sub: #4b5563;
  --text-faint: #9ca3af;
  --line: #e5e7eb;
  --success: #0f9f6e;
  --success-soft: #e2f6ee;
  --warning: #b45309;
  --warning-soft: #fdf1df;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --chart-1: #2256f2;
  --chart-2: #12b5a6;
  --chart-3: #7c9cff;
  --chart-4: #8be0d7;
  --chart-5: #c5ccd8;
  --ink: #0f172a;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --side-w: 232px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 21px; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }

/* 프로토타입 안내 줄 */
.proto { flex: none; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 7px 16px; background: var(--ink); color: #cbd5e1; font-size: 12px; line-height: 16px; }
.proto b { color: #fff; font-weight: 700; }
.proto .sp { flex: 1; }
.proto button { background: transparent; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; padding: 4px 9px; font-size: 12px; line-height: 16px; }
.proto button:hover { border-color: #94a3b8; }
.proto .proto-link { color: #c9d7ff; font-weight: 700; text-decoration: none; padding: 4px 6px; }
.proto .proto-link:hover { color: #fff; text-decoration: underline; }
.proto button[aria-pressed="true"] { background: #1e293b; border-color: #94a3b8; color: #fff; }

/* 앱 뼈대 */
.app { flex: 1; display: flex; min-height: 0; }
body.bare .app { display: none; }
#bare { display: none; flex: 1; overflow-y: auto; padding: 40px 16px; }
body.bare #bare { display: block; }
.side { width: var(--side-w); flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; padding: 20px 14px 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; }
.brand b { display: block; font-size: 17px; line-height: 22px; font-weight: 800; }
.brand small { font-size: 11px; color: var(--text-sub); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--text-sub); text-decoration: none; font-size: 15px; line-height: 20px; font-weight: 500; }
.nav a:hover { background: var(--surface-alt); color: var(--text); }
.nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.nav .cnt { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.nav .ph2 { margin-left: auto; font-size: 10px; line-height: 14px; font-weight: 700; color: var(--text-faint); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
.nav-div { font-size: 11px; line-height: 16px; font-weight: 700; color: var(--text-faint); padding: 16px 12px 6px; margin-top: 6px; border-top: 1px solid var(--line); }
.nav .sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 8px 36px; }
.nav .sub a { font-size: 13px; line-height: 18px; padding: 6px 10px; }
.nav .sub a.on { background: transparent; color: var(--primary); font-weight: 700; }
.side .foot { margin-top: auto; padding: 16px 10px 0; font-size: 11px; line-height: 16px; color: var(--text-faint); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { flex: none; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 32px; }
.menu-btn { display: none; }
.gsearch { position: relative; width: 320px; }
.gsearch input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px 0 38px; }
.gsearch > svg { position: absolute; left: 12px; top: 10px; color: var(--text-faint); }
.dd { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px -12px rgba(15, 23, 42, .25); z-index: 30; padding: 6px; max-height: 340px; overflow-y: auto; }
.dd button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; }
.dd button:hover, .dd button:focus-visible { background: var(--surface-alt); }
.dd small { color: var(--text-faint); font-size: 12px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
.who .sep { width: 1px; height: 16px; background: var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { color: var(--text); font-weight: 700; }
#view { flex: 1; overflow-y: auto; padding: 8px 32px 56px; }
.page { max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }

/* 제목 줄 */
.ph { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; padding-top: 8px; }
.ph h1 { font-size: 26px; line-height: 34px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ph p { margin: 4px 0 0; color: var(--text-sub); font-size: 13px; line-height: 19px; }
.ph .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.sid { display: none; font-size: 11px; line-height: 16px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 6px; padding: 2px 7px; vertical-align: middle; }
.show-ids .sid { display: inline-block; }
.crumb { font-size: 12px; color: var(--text-faint); display: flex; gap: 6px; align-items: center; }
.crumb a { color: var(--text-sub); text-decoration: none; }
.crumb a:hover { color: var(--primary); }

/* 카드·격자 */
.card { background: var(--surface); border-radius: 16px; padding: 20px 24px; min-width: 0; }
.card > h2, .card .ch h2 { font-size: 17px; line-height: 24px; font-weight: 800; margin: 0; }
.ch { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ch .r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ch small { color: var(--text-faint); font-size: 12px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 380px; }
.g-pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
.g-list { grid-template-columns: 300px minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--text-sub); }
.faint { color: var(--text-faint); }
.small { font-size: 12px; line-height: 18px; }
.strong { font-weight: 700; }
.r { text-align: right; }
.red { color: var(--danger); }
.green { color: var(--success); }
.amber { color: var(--warning); }
hr.div { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* 숫자 카드 */
.kpi .lab { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-sub); }
.kpi .val { font-size: 32px; line-height: 42px; font-weight: 800; margin-top: 10px; letter-spacing: -.01em; }
.kpi .sub { font-size: 12px; line-height: 18px; color: var(--text-sub); margin-top: 6px; }
.ic-b { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-alt); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }

/* 버튼 */
.btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; background: var(--surface-alt); color: var(--text-sub); text-decoration: none; }
.btn:hover { filter: brightness(.97); }
.btn-p { background: var(--primary); color: #fff; }
.btn-p:hover { background: var(--primary-press); filter: none; }
.btn-l { background: var(--surface); border-color: var(--line); color: var(--text); }
.btn-d { background: var(--danger-soft); color: var(--danger); }
.btn-g { background: transparent; color: var(--text-sub); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.link { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
.link.faint { color: var(--text-faint); }

/* 상태 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 14px; font-weight: 700; white-space: nowrap; }
.c-ok { background: var(--success-soft); color: var(--success); }
.c-warn { background: var(--warning-soft); color: var(--warning); }
.c-bad { background: var(--danger-soft); color: var(--danger); }
.c-info { background: var(--primary-soft); color: var(--primary); }
.c-teal { background: var(--accent-soft); color: #0b7f74; }
.c-mute { background: var(--surface-alt); color: var(--text-sub); }

/* 표 */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
.t th { background: var(--surface-alt); color: var(--text-sub); font-weight: 600; font-size: 13px; text-align: left; padding: 10px 14px; white-space: nowrap; }
.t th:first-child { border-radius: 10px 0 0 10px; }
.t th:last-child { border-radius: 0 10px 10px 0; }
.t td { padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.t td.wrap { white-space: normal; min-width: 180px; }
.t .r { text-align: right; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: #f8fafc; }
.t tr.hl td { background: #fffaf0; }
.t tfoot td { font-weight: 800; border-bottom: 0; }
.t .sum td { background: var(--surface-alt); font-weight: 700; }
.empty { text-align: center; color: var(--text-faint); padding: 36px 0; }
.pager { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
.pager button { min-width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--text-sub); font-weight: 600; }
.pager button.on { background: var(--primary-soft); color: var(--primary); }
.pager button:disabled { opacity: .35; cursor: default; }

/* 입력 */
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .lab-t { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--text-sub); }
.req::after { content: " *"; color: var(--danger); }
.in { height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--surface); width: 100%; min-width: 0; }
select.in { padding-right: 8px; }
textarea.in { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 21px; }
.in:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.in.err { border-color: var(--danger); }
.in.sm { height: 34px; border-radius: 8px; font-size: 13px; }
.in:disabled { background: var(--surface-alt); color: var(--text-faint); }
.err-t { color: var(--danger); font-size: 12px; line-height: 17px; }
.hint { color: var(--text-faint); font-size: 12px; line-height: 17px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .in { width: auto; }
.filters .grow { flex: 1; min-width: 180px; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--primary); }
.seg { display: inline-flex; background: var(--surface-alt); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--text-sub); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, .1); }
.tog { width: 40px; height: 24px; border-radius: 12px; border: 0; background: var(--line); position: relative; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.tog[aria-checked="true"] { background: var(--primary); }
.tog[aria-checked="true"]::after { left: 19px; }

/* 안내 상자 */
.note { border-radius: 12px; padding: 12px 16px; background: var(--primary-soft); color: #1e3a8a; font-size: 13px; line-height: 20px; display: flex; gap: 10px; align-items: flex-start; }
.note svg { flex: none; margin-top: 1px; }
.note.warn { background: var(--warning-soft); color: #7c4a03; }
.note.bad { background: var(--danger-soft); color: #9b1c1f; }
.note.ok { background: var(--success-soft); color: #0b6b4b; }
.note.gray { background: var(--surface-alt); color: var(--text-sub); }
.note b { font-weight: 700; }
.note .grow { flex: 1; }

/* 목록 줄 */
.li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t1 { font-weight: 600; }
.li .t2 { font-size: 12px; color: var(--text-sub); }

/* 점검 목록 */
.chk-i { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.chk-i:last-child { border-bottom: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.dot.ok { background: var(--success-soft); color: var(--success); }
.dot.bad { background: var(--danger-soft); color: var(--danger); }
.dot.warn { background: var(--warning-soft); color: var(--warning); }
.dot.info { background: var(--primary-soft); color: var(--primary); }
.dot.wait { background: var(--surface-alt); color: var(--text-faint); }
.chk-i .grow { flex: 1; min-width: 0; }
.chk-i .t1 { font-weight: 700; }
.chk-i .t2 { color: var(--text-sub); font-size: 13px; line-height: 19px; margin-top: 2px; }

/* 단계 */
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { flex: 1; min-width: 150px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.step .n { font-size: 11px; font-weight: 700; color: var(--text-faint); }
.step .t1 { font-weight: 700; margin-top: 2px; }
.step .t2 { font-size: 12px; color: var(--text-sub); line-height: 17px; margin-top: 2px; }
.step.now { border-color: var(--primary); background: var(--primary-soft); }
.step.now .n { color: var(--primary); }
.step.done .n { color: var(--success); }

/* 범례 */
.legend { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px 16px; align-items: center; font-size: 14px; }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; }
.legend .pc { color: var(--text-faint); font-size: 13px; min-width: 34px; text-align: right; }
.chart text { font-family: var(--font); fill: var(--text-sub); font-size: 11px; }

/* 겹창 */
.scrim { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 60px -20px rgba(15, 23, 42, .4); }
.modal.wide { width: min(780px, 100%); }
.modal h3 { margin: 0; font-size: 19px; line-height: 26px; font-weight: 800; }
.modal .mf { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal .x { margin-left: auto; }
.mh { display: flex; align-items: center; gap: 8px; }
.drawer-scrim { position: fixed; inset: 0; background: rgba(15, 23, 42, .3); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 51; box-shadow: -20px 0 40px -20px rgba(15, 23, 42, .3); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.drawer h3 { margin: 0; font-size: 19px; font-weight: 800; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 10px 12px; font-size: 14px; }
.kv dt { color: var(--text-sub); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 70; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; line-height: 20px; box-shadow: 0 12px 30px -10px rgba(15, 23, 42, .5); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .tog::after { transition: none; } }

/* 로그인 등 단독 화면 */
.solo { width: min(440px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.solo.wide { width: min(680px, 100%); }
.solo .brand { justify-content: center; padding: 0; }
.solo .card { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.solo h1 { font-size: 22px; line-height: 30px; margin: 0; font-weight: 800; }

/* 영수증 문서 */
.rdoc { border: 1px solid #9aa3b2; padding: 22px; font-size: 13px; line-height: 19px; background: #fff; }
.rdoc .tag { font-size: 11px; color: var(--text-faint); }
.rdoc h4 { text-align: center; font-size: 22px; letter-spacing: .5em; margin: 10px 0 4px; font-weight: 800; }
.rdoc .no { text-align: right; font-size: 12px; color: var(--text-sub); }
.rt { width: 100%; border-collapse: collapse; margin-top: 10px; }
.rt th, .rt td { border: 1px solid #c3c9d4; padding: 6px 8px; text-align: left; }
.rt th { background: var(--surface-alt); font-weight: 700; }
.rt .k { color: var(--text-sub); background: #fafbfc; width: 92px; }
.rdoc .sign { text-align: right; margin-top: 16px; }

/* 대시보드 할 일 */
.task { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task .grow { flex: 1; }
.task .n { font-weight: 800; min-width: 36px; text-align: right; }

/* 반응형 */
@media (max-width: 1180px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-main, .g-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 960px) {
  :root { --side-w: 76px; }
  .side { padding: 16px 10px; }
  .side .brand { justify-content: center; padding: 4px 0 18px; }
  .side .brand .bt, .nav .lbl, .nav .sub, .nav .ph2, .side .foot { display: none; }
  .nav-div { font-size: 0; padding: 0; margin: 8px 6px; }
  .side.open .nav-div { font-size: 11px; padding: 16px 12px 6px; }
  .nav a { justify-content: center; padding: 11px 0; position: relative; }
  .nav .cnt { position: absolute; top: 4px; right: 6px; min-width: 18px; height: 18px; font-size: 10px; padding: 0 5px; }
  .g3, .g-pair, .g-list { grid-template-columns: minmax(0, 1fr); }
  .who .cname, .who .sep { display: none; }
}
@media (max-width: 680px) {
  .side { display: none; }
  .side.open { display: flex; position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; width: 240px; box-shadow: 20px 0 40px -20px rgba(15, 23, 42, .4); }
  .side.open .brand { justify-content: flex-start; padding: 4px 8px 18px; }
  .side.open .brand .bt, .side.open .nav .lbl, .side.open .nav .sub, .side.open .nav .ph2 { display: initial; }
  .side.open .nav .sub { display: flex; }
  .side.open .nav a { justify-content: flex-start; padding: 10px 12px; }
  .side.open .nav .cnt { position: static; }
  .menu-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; flex: none; }
  .top { padding: 0 16px; }
  .gsearch { width: auto; flex: 1; }
  .who b, .who .role { display: none; }
  #view { padding: 4px 16px 48px; }
  .g4, .g2 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px 16px; }

  .kv { grid-template-columns: 96px 1fr; }
  .chk-i { flex-wrap: wrap; }
  .chk-i > .btn { margin-left: 34px; }
}

  /* ───────── AW-61 재정 리포트 발행 ───────── */
  function vReports(sc) {
    const months = MONTHS.slice(); const m = S.rep61; const st = repStatus(m);
    const STC = { published: ['발행됨', 'c-ok'], withdrawn: ['발행 취소', 'c-bad'], draft: ['발행 대기', 'c-warn'], open: ['마감 전', 'c-mute'] };

    let body;
    if (st === 'open') {
      body = '<div class="note gray">' + ic('lock', 's') + '<span class="grow">' + ymLabel(m) + '은 아직 마감하지 않았습니다. 마감한 숫자로만 리포트를 만듭니다(POL-09-04).</span>' + (m < monthOf(TODAY) ? '<button type="button" class="btn btn-p sm" data-go="aw-33" data-set="m33=' + m + '">월 마감으로</button>' : '') + '</div>';
    } else {
      const s = monthSum(m); const prev = m > START_MONTH ? monthSum(addMonth(m, -1)) : null; const d = reportData([m]);
      const groups = {}; Object.keys(d.exp).forEach((k) => { const g = k.split('|')[0]; groups[g] = (groups[g] || 0) + d.exp[k]; });
      const incItems = Object.keys(d.inc).map((k) => [k.split('|')[1], d.inc[k]]).sort((a, b) => b[1] - a[1]);
      const expItems = Object.keys(groups).map((k) => [k, groups[k]]).sort((a, b) => b[1] - a[1]);
      const bars = (items, col) => { const mx = Math.max.apply(null, items.map((x) => x[1]).concat([1])); return items.slice(0, 6).map((x) => '<div class="hbar"><span>' + esc(x[0]) + (x[0] === '인건비' ? ' <span class="faint small">(총액만)</span>' : '') + '</span><div class="meter"><i style="width:' + (x[1] / mx * 100).toFixed(1) + '%;background:' + col + '"></i></div><b class="num r">' + esc(manwon(x[1])) + '</b></div>').join(''); };
      const pct = (a, b) => (b ? ((a - b) / b * 100).toFixed(1) : '0.0');
      const cs = cardSummary(m); const r = DB.reports[m] || {}; const locked = st === 'published';
      body = '<div class="grid g3"><div><div class="small muted">수입</div><b class="num green" style="font-size:20px">' + esc(manwon(s.inc)) + '</b>' + (prev ? '<div class="hint">전월보다 ' + pct(s.inc, prev.inc) + '%</div>' : '') + '</div><div><div class="small muted">지출</div><b class="num" style="font-size:20px">' + esc(manwon(s.exp)) + '</b>' + (prev ? '<div class="hint">전월보다 ' + pct(s.exp, prev.exp) + '%</div>' : '') + '</div><div><div class="small muted">차기 이월</div><b class="num" style="font-size:20px">' + esc(manwon(carryIn(m) + s.inc - s.exp)) + '</b></div></div>' +
        '<div class="grid g2"><div class="stack" style="gap:8px"><b>수입 (항목별)</b>' + bars(incItems, 'var(--chart-1)') + '</div><div class="stack" style="gap:8px"><b>지출 (관별)</b>' + bars(expItems, 'var(--chart-2)') + '</div></div>' +
        (DB.pub.stages.card.on ? '<div class="note">' + ic('card', 's') + '<span class="grow">교회 카드 사용 <b>' + cs.n + '건 · ' + won(cs.sum) + '</b>이 함께 공개됩니다. 가맹점 가림 ' + cs.masked + '건, 비공개 ' + cs.hidden + '건(합계에는 포함).</span><button type="button" class="btn btn-l sm" data-go="aw-79" data-set="f79.month=' + m + ';f79.st=">카드 내역</button></div>' : '<div class="hint">카드 사용 내역 공개(4단계)는 꺼져 있습니다. 공개 설정에서 켤 수 있습니다.</div>') +
        '<div class="hint">예산 대비 표는 예산 기능(3차) 뒤에 들어갑니다(A-184).</div>' +
        '<div class="fld"><label for="rep-note">재정부장 설명</label><textarea class="in" id="rep-note" maxlength="520" ' + (locked ? 'disabled' : '') + ' placeholder="이달 수입·지출에서 눈에 띄는 점을 교인이 이해하기 쉽게 적어 주세요">' + esc(r.note || '') + '</textarea>' + (st === 'withdrawn' ? '<span class="err-t">발행 취소 사유: ' + esc(r.reason || '') + '</span>' : '') + '</div>' +
        '<div class="row" style="justify-content:flex-end">' + (locked ? '<button type="button" class="btn btn-d" data-act="repWithdraw" data-m="' + m + '">발행 취소</button>' : '<button type="button" class="btn btn-p" data-act="repPublish" data-m="' + m + '" ' + (DB.pub.stages.report.on ? '' : 'disabled') + '>' + (st === 'withdrawn' ? '다시 발행' : '발행하기') + '</button>') + '</div>' +
        (DB.pub.stages.report.on ? '' : '<span class="hint" style="text-align:right">재정 리포트 공개(2단계)가 꺼져 있어 발행할 수 없습니다.</span>');

    if (!q) { if (dd) dd.remove(); return; }
    if (!dd) { dd = document.createElement('div'); dd.className = 'dd'; box.appendChild(dd); }
    const l = DB.members.filter((m) => m.name.indexOf(q) >= 0).slice(0, 7);
    dd.innerHTML = l.map((m) => '<button type="button" data-go="aw-71" data-set="memberId=' + m.id + '">' + ic('users', 's') + '<span>' + esc(m.name) + ' <small>' + esc(memShort(m)) + ' · ' + m.birth.slice(2, 4) + '년생</small></span></button>').join('') + '<button type="button" data-go="aw-20" data-set="f20.q=' + esc(q) + ';f20.month=2026-10;f20.type=;f20.src=;f20.page=1">' + ic('search', 's') + '<span>\'' + esc(q) + '\' 10월 헌금 내역에서 찾기</span></button>';
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if ($('#layer').innerHTML) closeLayer(); else { const dd = $('#gsearch .dd'); if (dd) dd.remove(); } }
    if (e.key === 'Enter' && e.target.id === 'gq') { const v = e.target.value.trim(); if (v) { applySet('f20.q=' + v + ';f20.month=2026-10;f20.type=;f20.src=;f20.page=1'); e.target.value = ''; const dd = $('#gsearch .dd'); if (dd) dd.remove(); go('aw-20'); } }
    if (e.key === 'Enter' && e.target.id === 'lg-code') ACT.login2();
    if (e.key === 'Enter' && e.target.id === 'askIn' && e.target.tagName === 'INPUT') { const ok = $('#askOk'); if (ok) ok.click(); }
  });
  window.addEventListener('hashchange', () => { closeLayer(); render(); });
  $('.menu-btn').innerHTML = ic('menu');
  $('#gsearch').insertAdjacentHTML('afterbegin', ic('search', 's'));

  DB = makeDB(); S = freshState();
  render();
})();
</script>
</body>
</html>
